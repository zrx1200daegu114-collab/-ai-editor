<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI EDITOR</title>
<style>body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,sans-serif}.w{max-width:720px;margin:auto;padding:22px 16px 60px}.card{background:#171b25;border:1px solid #303747;border-radius:18px;padding:18px;margin:14px 0}h1{margin:8px 0}.sub{color:#aeb6c7}.step{color:#a994ff;font-weight:bold;font-size:13px}.upload{display:block;border:2px dashed #4a5369;border-radius:15px;padding:25px;text-align:center}input[type=file]{display:none}.file{padding:9px;margin-top:7px;background:#10141c;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.c{padding:12px;text-align:center;border:1px solid #343c4d;border-radius:12px}.c.on{border-color:#9179ff;background:#282044}select,textarea,button{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-size:16px}select,textarea{background:#0f131b;color:#fff;border:1px solid #343c4d;margin-top:8px}textarea{height:85px}button{border:0;background:#7d5cff;color:white;font-weight:bold;margin-top:14px}.hide{display:none}.result{line-height:1.7}.note{font-size:12px;color:#aeb6c7}</style></head>
<body><div class="w"><h1>AI EDITOR <small>試作版</small></h1><p class="sub">複数動画を選んで、SNS・ジャンルに合わせたAI編集へ。</p>
<div class="card"><div class="step">STEP 1</div><h3>動画を選ぶ</h3><label class="upload" for="v"><b>＋ 動画を選択</b><br><span class="sub">複数選択できます</span></label><input id="v" type="file" accept="video/*" multiple><div id="list"></div></div>
<div class="card"><div class="step">STEP 2</div><h3>投稿するSNS</h3><div class="grid" id="sns"><div class="c on">TikTok</div><div class="c">Instagram Reels</div><div class="c">YouTube Shorts</div><div class="c">X</div><div class="c">YouTube</div></div></div>
<div class="card"><div class="step">STEP 3</div><h3>ジャンルと編集方針</h3><select id="genre"><option>お笑い・コメディ</option><option>グルメ・料理</option><option>Vlog</option><option>ゲーム</option><option>配信・切り抜き</option><option>音楽</option><option>美容・ファッション</option><option>旅行</option><option>ビジネス</option><option>商品紹介</option></select><select id="style"><option>AIにおまかせ</option><option>再生数・伸び重視</option><option>テンポ重視</option><option>おしゃれ重視</option><option>プロっぽく</option></select><textarea id="prompt" placeholder="例：最初の3秒を強く。ツッコミの字幕を大きく。"></textarea><button id="go" disabled>AI編集プランを作る</button><p class="note">この段階では操作の試作品です。実際の動画結合・字幕生成・MP4出力は次にサーバー処理を接続します。</p></div>
<div class="card hide" id="out"><h3>✓ 編集プラン完成</h3><div class="result" id="r"></div></div></div>
<script>let fs=[],sn='TikTok';const v=document.getElementById('v'),go=document.getElementById('go');v.onchange=()=>{fs=[...v.files];document.getElementById('list').innerHTML=fs.map((f,i)=>'<div class="file">'+(i+1)+'．'+f.name+'</div>').join('');go.disabled=!fs.length};document.querySelectorAll('#sns .c').forEach(e=>e.onclick=()=>{document.querySelectorAll('#sns .c').forEach(x=>x.classList.remove('on'));e.classList.add('on');sn=e.textContent});go.onclick=()=>{let g=document.getElementById('genre').value,s=document.getElementById('style').value,p=document.getElementById('prompt').value||'追加指示なし';document.getElementById('r').innerHTML='<b>素材：</b>'+fs.length+'本を1本にまとめる<br><b>SNS：</b>'+sn+'<br><b>ジャンル：</b>'+g+'<br><b>編集：</b>'+s+'<br><b>追加指示：</b>'+p+'<br><br>・不要部分をカット<br>・冒頭に見どころ<br>・字幕追加<br>・投稿先に画角最適化<br>・複数素材をテンポよく結合';document.getElementById('out').classList.remove('hide');document.getElementById('out').scrollIntoView({behavior:'smooth'})}</script></body></html>
